---
- name: Доставить и развернуть трекер заявок на Ubuntu
  hosts: repair_servers
  become: true
  gather_facts: true

  tasks:
    - name: Подготовить Ubuntu и Docker
      ansible.builtin.import_tasks: tasks/prepare.yml

    - name: Доставить исходники и файлы сборки с управляющей машины
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../{{ item }}"
        dest: "{{ repair_app_dir }}/"
        owner: root
        group: root
        mode: "0644"
        directory_mode: "0755"
      loop:
        - app.py
        - store.py
        - creation.py
        - management.py
        - requirements.txt
        - requirements-container.txt
        - Dockerfile
        - .dockerignore
        - static
        - templates
        - tests
        - ci
      register: repair_sources

    - name: Создать серверную конфигурацию Compose
      ansible.builtin.template:
        src: compose.yaml.j2
        dest: "{{ repair_app_dir }}/compose.yaml"
        owner: root
        group: root
        mode: "0644"
      register: repair_compose

    - name: Собрать и запустить приложение
      community.docker.docker_compose_v2:
        project_src: "{{ repair_app_dir }}"
        project_name: "{{ repair_project_name }}"
        state: present
        build: "{{ 'always' if repair_sources.changed or repair_compose.changed else 'policy' }}"
        wait: true
        wait_timeout: 180

    - name: Проверить готовность приложения
      ansible.builtin.import_tasks: tasks/verify.yml
