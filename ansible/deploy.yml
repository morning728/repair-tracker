---
- name: Доставить и развернуть трекер заявок на Ubuntu
  hosts: repair_servers
  become: true
  gather_facts: true

  pre_tasks:
    - name: Проверить операционную систему и архитектуру
      ansible.builtin.assert:
        that:
          - ansible_facts['distribution'] == 'Ubuntu'
          - ansible_facts['distribution_version'] in ['22.04', '24.04']
          - ansible_facts['architecture'] in repair_docker_architectures
        fail_msg: Требуется Ubuntu 22.04/24.04 с архитектурой amd64 или arm64.

    - name: Проверить настройки развёртывания
      ansible.builtin.assert:
        that:
          - repair_app_port | int >= 1024
          - repair_app_port | int <= 65535
          - repair_app_dir is match('^/opt/[a-zA-Z0-9_-]+$')
          - repair_project_name is match('^[a-z0-9][a-z0-9_-]*$')
          - repair_bind_address in ['127.0.0.1', '0.0.0.0']
        fail_msg: Проверьте путь /opt, порт и адрес публикации приложения.

  tasks:
    - name: Установить зависимости пакетного менеджера
      ansible.builtin.apt:
        name:
          - ca-certificates
          - python3-apt
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Создать каталог ключей APT
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Получить ключ официального репозитория Docker
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        owner: root
        group: root
        mode: "0644"
        validate_certs: true

    - name: Подключить официальный репозиторий Docker
      ansible.builtin.apt_repository:
        repo: >-
          deb [arch={{ repair_docker_architectures[ansible_facts['architecture']] }}
          signed-by=/etc/apt/keyrings/docker.asc]
          https://download.docker.com/linux/ubuntu
          {{ ansible_facts['distribution_release'] }} stable
        filename: docker
        state: present
        update_cache: true

    - name: Установить Docker Engine и Compose
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present

    - name: Включить и запустить Docker
      ansible.builtin.service:
        name: docker
        enabled: true
        state: started

    - name: Создать каталог приложения
      ansible.builtin.file:
        path: "{{ repair_app_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Доставить исходники и файлы сборки с управляющей машины
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../{{ item }}"
        dest: "{{ repair_app_dir }}/"
        owner: root
        group: root
        mode: "0644"
        directory_mode: "0755"
      loop:
        - app.py
        - store.py
        - creation.py
        - management.py
        - requirements.txt
        - requirements-container.txt
        - Dockerfile
        - .dockerignore
        - static
        - templates
        - tests
      register: repair_sources

    - name: Создать серверную конфигурацию Compose
      ansible.builtin.template:
        src: compose.yaml.j2
        dest: "{{ repair_app_dir }}/compose.yaml"
        owner: root
        group: root
        mode: "0644"
      register: repair_compose

    - name: Собрать и запустить приложение
      community.docker.docker_compose_v2:
        project_src: "{{ repair_app_dir }}"
        project_name: "{{ repair_project_name }}"
        state: present
        build: "{{ 'always' if repair_sources.changed or repair_compose.changed else 'policy' }}"
        wait: true
        wait_timeout: 180

    - name: Проверить HTTP и доступность базы приложения
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ repair_app_port }}/health"
        status_code: 200
        return_content: true
      register: repair_health
      until: repair_health.status | default(0) == 200 and repair_health.json.status | default('') == 'ok'
      retries: 12
      delay: 5

    - name: Показать результат развёртывания
      ansible.builtin.debug:
        msg:
          - "Приложение развёрнуто в {{ repair_app_dir }}."
          - "HTTP-порт: {{ repair_app_port }}, адрес публикации: {{ repair_bind_address }}."
          - Данные SQLite сохраняются в именованном томе Docker.
