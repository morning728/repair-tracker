name: repair-tracker-ci
services:
  web:
    image: "${REPAIR_IMAGE:?Set REPAIR_IMAGE to the built image tag}"
    pull_policy: never
    ports:
      - "127.0.0.1:${APP_PORT:-8081}:8000"
    volumes:
      - repair-data:/app/data
    restart: unless-stopped
    stop_grace_period: 20s
volumes:
  repair-data:
